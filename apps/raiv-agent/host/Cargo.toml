[package]
name = "raiv-agent-host"
version = "0.0.1"
edition = "2021"
rust-version = "1.86"
publish = false
license = "Unlicense"

[lib]
name = "raiv_agent_host"

[[bin]]
name = "raiv-agent"
path = "src/main.rs"

[dependencies]
raiv = { path = "../../../lib", default-features = false }
minicbor = { version = "=2.3.0", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.152", default-features = false, features = ["std"] }
ureq = { version = "=3.1.2", default-features = false, features = ["rustls"] }
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "stable", "validate", "portable-dispatch"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.190", default-features = false }
guest = { package = "raiv-agent-guest", path = "../guest", default-features = false }
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.28.1", default-features = false, features = ["events", "bracketed-paste"] }
unicode-segmentation = { version = "=1.12.0", default-features = false }
unicode-width = { version = "=0.2.0", default-features = false }

[dev-dependencies]
guest = { package = "raiv-agent-guest", path = "../guest", default-features = false }
ciborium = { version = "=0.2.2", default-features = false }
